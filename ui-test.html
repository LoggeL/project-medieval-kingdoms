<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prüfstand Oberfläche – Medieval Kingdoms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Jacquarda+Bastarda+9&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2414; }
    #scene { position: fixed; inset: 0; display: block; }
    /* Bedienfeld des Prüfstands (nicht Teil des Spiels) */
    #dev { position: fixed; left: 12px; top: 50%; transform: translateY(-30%); z-index: 50; width: 220px; font: 12px/1.3 system-ui, sans-serif; color: #eee; background: rgba(0, 0, 0, .72); border: 1px dashed #aaa; border-radius: 6px; padding: 6px 8px 8px; }
    #dev.dev-closed .dev-btns, #dev.dev-closed .dev-log { display: none; }
    #dev-toggle { all: unset; cursor: pointer; font-weight: 700; color: #ffd27a; }
    .dev-btns { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
    .dev-btns button { font: 11px system-ui; padding: 2px 6px; border: 1px solid #777; background: #333; color: #eee; border-radius: 3px; cursor: pointer; }
    .dev-btns button:hover { background: #555; }
    .dev-log { margin: 6px 0 0; padding-left: 16px; max-height: 120px; overflow: auto; color: #bbb; word-break: break-all; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="ui"></div>
  <div id="dev" class="dev-closed"><button id="dev-toggle" type="button">Prüfstand ▸</button></div>
  <script type="module" src="/src/ui/dev/main.ts"></script>
</body>
</html>
