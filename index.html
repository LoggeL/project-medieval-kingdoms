<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medieval Kingdoms – Prototyp</title>
  <!-- Schriften selbst gehostet (src/ui/fonts.css, Vite bündelt sie), keine Anfrage an Google Fonts -->
  <link rel="stylesheet" href="/src/ui/fonts.css">
  <!-- kein eigenes Favicon: verhindert die Anfrage nach /favicon.ico (404) -->
  <link rel="icon" href="data:,">
  <!-- Lade- und Titelbildschirm: Stil schon vor dem Spielcode (src/ui/start) -->
  <link rel="stylesheet" href="/src/ui/start/start.css">
  <!-- Schlüsselbild des Titels parallel zum Spielcode laden: der Titel erscheint, sobald es da ist -->
  <link rel="preload" as="image" href="/ui/titel_schluesselbild.png" fetchpriority="high">
</head>
<body>
  <!-- Ladebildschirm: sofort sichtbar, src/ui/start/laden.ts übernimmt ihn, sobald der Spielcode läuft -->
  <div id="mk-laden" class="mk-start mk-laden" aria-busy="true">
    <div class="mk-laden-bild"></div>
    <h1 class="mk-laden-titel">Medieval Kingdoms</h1>
    <div class="mk-laden-unten">
      <div class="mk-leiste" role="progressbar" aria-label="Ladefortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="mk-leiste-bahn"><div class="mk-leiste-fuell"></div></div></div>
      <p class="mk-laden-schritt" aria-live="polite">Spielcode wird geladen …</p>
      <p class="mk-laden-haenger">Das Laden dauert ungewöhnlich lange. <a href="">Seite neu laden</a></p>
      <noscript><p class="mk-laden-meldung"><strong>JavaScript ist aus</strong>Das Spiel braucht JavaScript und WebGL.</p></noscript>
    </div>
  </div>
  <div id="game"></div>
  <div id="ui"></div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
