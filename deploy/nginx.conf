# Wird als /etc/nginx/conf.d/default.conf in den http-Block eingebunden (map ist dort erlaubt).

# Spiel unter /, Konzeptseite unter /konzept/, Schriften der Konzeptseite unter /fonts/ (alles aus dem Vite-Build,
# siehe vite.config.ts und docs/DEPLOYMENT.md). Die alte Adresse /spiel/ leitet dauerhaft auf / um.

# Lange Cache-Zeit nur für erfolgreiche Antworten; eine 404 unter /assets/ darf nicht 30 Tage hängen bleiben.
map $status $mk_cache_bundle {
    200     "public, max-age=2592000, immutable";
    206     "public, max-age=2592000, immutable";
    304     "public, max-age=2592000, immutable";
    default "no-store";
}
map $status $mk_cache_font {
    200     "public, max-age=604800";
    206     "public, max-age=604800";
    304     "public, max-age=604800";
    default "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    # Weiterleitungen relativ (Location: /konzept/), damit hinter dem HTTPS-Proxy kein http://…:8080 entsteht
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Alte Adressen (bis 17.11.2026 lag das Spiel unter /spiel/): dauerhaft auf die neuen umleiten, geteilte Links
    # funktionieren weiter. rewrite … permanent hängt den Suchteil (?…) von selbst an.
    location = /spiel {
        return 301 /$is_args$args;
    }
    location ^~ /spiel/ {
        rewrite ^/spiel/(.*)$ /$1 permanent;
    }

    # /konzept ohne Schrägstrich: auf die Konzeptseite
    location = /konzept {
        return 301 /konzept/$is_args$args;
    }

    # Spiel: gehashte Bundles und Schriften (Vite) lange cachen, fehlende Dateien sind 404
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control $mk_cache_bundle always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Schriften der Konzeptseite (vom Vite-Build aus @fontsource kopiert)
    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control $mk_cache_font always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Jede Datei mit Endung (Sprites, sheet.json, Musik, index.html): gibt es sie nicht, ist das eine 404
    # und nicht die Einstiegsseite mit 200
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Spiel: Einstiegsseite
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Konzeptseite (Design-Dokument, Menüpunkt im Titelbildschirm)
    location = /konzept/ {
        try_files /konzept/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Sonst kein Rückfall auf eine Einstiegsseite: Das Spiel hat keine eigenen URL-Pfade, und weil es seine Dateien
    # relativ lädt (Vite base "./"), wäre index.html unter /x/y ohnehin kaputt. Fehlendes ist 404.
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
