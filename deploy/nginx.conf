# Wird als /etc/nginx/conf.d/default.conf in den http-Block eingebunden (map ist dort erlaubt).

# Lange Cache-Zeit nur für erfolgreiche Antworten; eine 404 unter /spiel/assets/ darf nicht 30 Tage hängen bleiben.
map $status $mk_cache_bundle {
    200     "public, max-age=2592000, immutable";
    206     "public, max-age=2592000, immutable";
    304     "public, max-age=2592000, immutable";
    default "no-store";
}
map $status $mk_cache_font {
    200     "public, max-age=604800";
    206     "public, max-age=604800";
    304     "public, max-age=604800";
    default "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    # Weiterleitungen relativ (Location: /spiel/), damit hinter dem HTTPS-Proxy kein http://…:8080 entsteht
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # /spiel ohne Schrägstrich fiele sonst auf die Konzeptseite zurück
    location = /spiel {
        return 301 /spiel/;
    }

    # Spiel: gehashte Bundles und Schriften (Vite) lange cachen, fehlende Dateien sind 404
    location ^~ /spiel/assets/ {
        try_files $uri =404;
        add_header Cache-Control $mk_cache_bundle always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Schriften der Konzeptseite (im Dockerfile aus @fontsource kopiert)
    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control $mk_cache_font always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Jede Datei mit Endung (Sprites, sheet.json, Musik unter /spiel/, sonstige unter /): gibt es sie nicht,
    # ist das eine 404 und nicht die Einstiegsseite mit 200
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Spiel: Einstiegsseite
    location = /spiel/ {
        try_files /spiel/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Spiel: sonst kein Rückfall auf die Einstiegsseite. Das Spiel hat keine eigenen URL-Pfade, und weil es seine
    # Dateien relativ lädt (Vite base "./"), wäre index.html unter /spiel/x/y ohnehin kaputt.
    location /spiel/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Konzeptseite
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
